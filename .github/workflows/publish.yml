name: Publish to npm

# Publishes @swampratnz/agent-base to the PUBLIC npmjs.com registry on a
# version tag.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY npmjs.com AND NOT GITHUB PACKAGES
# ─────────────────────────────────────────────────────────────────────────────
# The Phase 0 note in docs/ROADMAP.md originally recorded GitHub Packages. That
# decision is overruled: GitHub Packages' npm registry requires an
# authenticated token to INSTALL, even for a public package. That would put a
# credential — and a credential expiry — between the production deploy host and
# `npm ci`, i.e. exactly in the path of a 2am redeploy. Public npm needs no auth
# on any consumer, so a fresh box installs the framework with nothing
# configured. Publishing is the only side that holds a secret, and that side is
# this workflow.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT IT RUNS
# ─────────────────────────────────────────────────────────────────────────────
# The FULL gate set — the union of CI's three jobs — before anything is
# published. A publish that skipped the gates would ship a package that no
# check ever adjudicated, and unlike a bad merge it cannot be reverted: npm
# versions are immutable, and the remedy is a deprecate + a new version (see
# docs/RELEASING.md). So the gate runs here even though the same commit
# already passed CI on `main`: a tag can point at any commit, including one
# that never went through a PR.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTHENTICATION: TRUSTED PUBLISHING (OIDC) — THERE IS NO TOKEN
# ─────────────────────────────────────────────────────────────────────────────
# This workflow holds NO npm credential. Not a secret, not NODE_AUTH_TOKEN, not
# NPM_TOKEN. It authenticates to npm by exchanging a short-lived GitHub OIDC
# token for a publish grant that npm has pre-authorised against this exact
# repository AND this exact workflow FILENAME. npm now warns against long-lived
# automation tokens and steers to this instead — and the reason is plain: a
# leaked automation token publishes from anywhere, forever, until someone
# notices; an OIDC exchange is minted per run, expires in minutes, and is
# useless outside this workflow file.
#
# Consequences worth knowing before you edit this file:
#
#   * RENAMING THIS FILE BREAKS PUBLISHING. The trusted publisher is registered
#     against `publish.yml` by name. Rename it and every release fails to
#     authenticate until someone updates the setting on npmjs.com.
#   * `id-token: write` is what mints the OIDC token. Remove it and the publish
#     cannot authenticate. It is granted at the JOB level only.
#   * PROVENANCE IS AUTOMATIC. npm generates and publishes provenance
#     attestations for a trusted-publishing release by default — the
#     `--provenance` flag is redundant and is deliberately NOT passed. (This
#     needs a public repository, which swampratnz/agent-base is: verified
#     against the GitHub API when this workflow was written.)
#   * VERSION FLOORS ARE HARD. Trusted publishing requires npm CLI >= 11.5.1
#     and Node >= 22.14.0 (docs.npmjs.com/trusted-publishers). The npm bundled
#     with the runner's Node can be older, so npm is upgraded explicitly below
#     and BOTH versions are asserted in preflight — an old npm does not know
#     what OIDC is and fails with an authentication error that reads like a
#     misconfigured publisher.
#   * NO PACKAGE-MANAGER CACHING on the release path, per npm's own example
#     workflow ("never use caching in release builds").
#
# ─────────────────────────────────────────────────────────────────────────────
# THE FIRST RELEASE DID NOT COME THROUGH HERE
# ─────────────────────────────────────────────────────────────────────────────
# npm cannot configure a trusted publisher for a package that does not exist:
# the npmjs.com UI only offers the setting on an existing package
# (npm/cli#8544). So 0.1.0 was published BY HAND from a clean checkout of the
# tag on 2026-08-03, the trusted publisher was configured against it, and
# 0.1.1 went out through this workflow the same day with no credential
# anywhere. That bootstrap is DONE and does not recur — a run of this workflow
# that fails to authenticate now is a real fault, most likely the npmjs
# trusted-publisher setting having been changed. See docs/RELEASING.md's
# "When a release fails to authenticate". The one lasting trace is that 0.1.0
# carries no provenance attestation, having come from a laptop rather than CI.
#
# ─────────────────────────────────────────────────────────────────────────────
# DRY RUN
# ─────────────────────────────────────────────────────────────────────────────
# `workflow_dispatch` defaults to a dry run, and the dry-run path runs
# EVERYTHING — every gate, the tarball contents check, and
# `npm publish --dry-run` — so the whole release can be exercised before any
# version is burned. A dry run does not authenticate at all, so it can be run
# from any branch at any time. What it therefore cannot exercise is the OIDC
# exchange itself; docs/RELEASING.md says so rather than pretending otherwise.

on:
  push:
    # Only fully-qualified version tags. A `v1.2` or a `release-1.2.3` is not a
    # release here, and silently publishing one would be worse than not firing.
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the whole pipeline but stop at `npm publish --dry-run` (nothing is published)'
        type: boolean
        default: true

# Least privilege. `id-token: write` is granted at the JOB level only, where
# the OIDC exchange needs it — not here, so nothing else in this file could
# ever mint an OIDC token. `contents: read` is all the checkout needs; this
# workflow creates no tags, releases or commits.
permissions:
  contents: read

# A publish must never be cancelled halfway. Two tags pushed together should
# queue, not supersede each other — the loser would otherwise never publish and
# would leave a tag pointing at a version that is not on the registry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # THE credential. Trusted publishing exchanges the OIDC token this
      # permission mints for a publish grant; without it there is no way for
      # this job to authenticate to npm at all, because there is no token to
      # fall back on. It also carries the automatic provenance attestation.
      id-token: write
    services:
      # Same image and health-check shape as ci.yml, so the DB-backed tests
      # behave here exactly as they do there. repository.test.ts alone carries
      # 117 SECURITY: cases and they are worth strictly more than a skip.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # persist-credentials:false for the same reason as ci.yml: no step after
      # checkout needs a git credential, and this job runs npm lifecycle
      # scripts, so the job token must not sit readable in .git/config.
      # fetch-depth:0 because the preflight's tag-ancestry check needs the
      # history between the tagged commit and origin/main; a depth-1 clone
      # cannot answer `merge-base --is-ancestor`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Writes the ~/.npmrc that points the scope at public npm. Without
          # this, `npm publish` would fall back to whatever registry the
          # runner's default .npmrc names — and the OIDC exchange is with
          # registry.npmjs.org specifically.
          registry-url: 'https://registry.npmjs.org'
          # npm's own trusted-publishing example: "never use caching in release
          # builds". A cache is a mutable input to an artifact that is about to
          # become immutable and signed; restoring one would put something
          # outside this commit into the published tarball's provenance story.
          package-manager-cache: false

      # The runner's bundled npm can predate trusted publishing entirely, and an
      # npm that has never heard of OIDC fails at `npm publish` with an
      # authentication error indistinguishable from a misconfigured publisher.
      # Upgrade explicitly; the preflight assertion below is what actually
      # guarantees the floor, this step is only the mechanism.
      #
      # PINNED TO THE 11.x LINE, not `@latest`. npm 12 disables git-protocol
      # dependencies by default (`EALLOWGIT`), and this tree has one
      # transitively — `libsignal`, via `@whiskeysockets/baileys` — so
      # `npm ci` refuses the install outright. `@latest` meant the release
      # path silently adopted npm's breaking default changes on npm's
      # schedule rather than ours, while ci.yml (bundled npm 10) never saw
      # them: a release could break with no code change and nothing red
      # beforehand.
      #
      # Moving to 12 needs `--allow-git all` on every install here, which
      # re-opens the very default 12 added deliberately. The better fix is
      # upstream — a baileys that does not pull a git dependency — so this
      # stays pinned until then rather than papering over it.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g 'npm@^11.5.1'

      # ───────────────────────────────────────────────────────────────────────
      # Preflight. Everything that can be known BEFORE ~20 minutes of gates
      # runs here, so the classic release mistakes fail in seconds: a tag that
      # disagrees with package.json, a real publish attempted off a tag, a
      # toolchain too old to authenticate, OIDC not actually available.
      # ───────────────────────────────────────────────────────────────────────
      - name: Preflight — toolchain floors, OIDC, tag vs package.json, licence
        id: preflight
        env:
          # Referenced as env, never interpolated into the script body: an
          # input or a ref name is attacker-influenced text and must not become
          # shell source.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A tag push is always a real publish. A manual run is a dry run
          # unless the operator explicitly said otherwise.
          if [ "${EVENT_NAME}" = "push" ]; then
            dry_run=false
          elif [ "${INPUT_DRY_RUN}" = "false" ]; then
            dry_run=false
          else
            dry_run=true
          fi

          version=$(node -p 'require("./package.json").version')
          name=$(node -p 'require("./package.json").name')
          echo "package: ${name}@${version}"
          echo "mode: $([ "${dry_run}" = "true" ] && echo 'DRY RUN' || echo 'PUBLISH')"

          fail() { echo "::error::$*"; exit 1; }

          # `npm ci` refuses when package-lock.json's root version disagrees
          # with package.json's, and a bare `npm pkg set version` (or a
          # hand-edit) updates only the latter. CI never catches it: this job
          # upgrades to an npm new enough for trusted publishing, which
          # enforces the check, while ci.yml runs the runner's bundled npm,
          # which does not — so the tree can be green everywhere and still be
          # unpublishable. Assert it here, in a second, rather than a minute
          # into the release. Use `npm version` (it writes both) and this stays
          # quiet.
          lock_version=$(node -p 'require("./package-lock.json").version')
          if [ "${lock_version}" != "${version}" ]; then
            fail "package-lock.json is at '${lock_version}' but package.json is at '${version}'. \`npm ci\` will refuse this tree. Run \`npm install --package-lock-only\` and commit the result."
          fi

          # Numeric semver compare, because `sort -V` is not on every runner and
          # a string compare puts 11.5.1 below 9.0.0.
          version_at_least() {
            node -e '
              const norm = (s) => String(s).trim().replace(/^v/, "").split("-")[0].split(".").map(Number);
              const [a, b] = [norm(process.argv[1]), norm(process.argv[2])];
              for (let i = 0; i < 3; i++) {
                const x = a[i] || 0, y = b[i] || 0;
                if (x !== y) { console.log(x > y ? "yes" : "no"); process.exit(0); }
              }
              console.log("yes");
            ' "$1" "$2"
          }

          # Trusted publishing's hard floors, from docs.npmjs.com/trusted-publishers.
          # An npm below 11.5.1 has no OIDC support at all and fails at publish
          # time with an authentication error that reads exactly like a
          # misconfigured trusted publisher on npmjs.com — hours of looking in
          # the wrong place. Assert instead.
          NPM_FLOOR=11.5.1
          NODE_FLOOR=22.14.0
          npm_version=$(npm --version)
          node_version=$(node -p 'process.versions.node')
          echo "toolchain: npm ${npm_version} (floor ${NPM_FLOOR}), node ${node_version} (floor ${NODE_FLOOR})"
          if [ "$(version_at_least "${npm_version}" "${NPM_FLOOR}")" != "yes" ]; then
            fail "npm ${npm_version} is below the trusted-publishing floor of ${NPM_FLOOR}. The 'Upgrade npm' step should have fixed this — check that it ran and succeeded."
          fi
          if [ "$(version_at_least "${node_version}" "${NODE_FLOOR}")" != "yes" ]; then
            fail "Node ${node_version} is below the trusted-publishing floor of ${NODE_FLOOR}. Raise node-version on the setup-node step."
          fi

          # And a CEILING, which is not symmetry for its own sake: npm 12
          # disables git-protocol dependencies by default, this tree has one
          # transitively (libsignal, via @whiskeysockets/baileys), and the
          # install dies with EALLOWGIT — a message that says nothing about
          # npm's major version. Whoever relaxes the pin above should be told
          # what they are walking into, here, rather than 14 seconds later.
          NPM_CEILING=12.0.0
          if [ "$(version_at_least "${npm_version}" "${NPM_CEILING}")" = "yes" ]; then
            fail "npm ${npm_version} is >= ${NPM_CEILING}, which refuses git-protocol dependencies by default; this tree has one transitively (libsignal, via @whiskeysockets/baileys) and \`npm ci\` will fail with EALLOWGIT. The 'Upgrade npm' step pins the 11.x line on purpose — see its comment before changing it."
          fi

          # `private: true` was the alternative path (never publish). If it
          # ever comes back, npm refuses with a terse message; say why here.
          if node -p 'require("./package.json").private === true' | grep -qx true; then
            fail "package.json sets \"private\": true — this package is not publishable. Remove it, or revert this workflow."
          fi

          # A public npm package with no license field is published without any
          # terms at all, which is not a thing this workflow can decide on the
          # owner's behalf. See docs/RELEASING.md — it is prerequisite #1.
          license=$(node -p 'require("./package.json").license || ""')
          if [ -z "${license}" ] || [ "${license}" = "UNLICENSED" ]; then
            fail "package.json has no usable \"license\" field (got: '${license:-<unset>}'). Publishing a public package with no licence terms is an owner decision, not a workflow default: pick an SPDX identifier, add a matching LICENSE file, and set \"license\" in package.json. See docs/RELEASING.md."
          fi

          # The field alone is not the licence: npm ships LICENSE into every
          # tarball automatically, so a field with no file publishes terms the
          # consumer cannot actually read.
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ] && [ ! -f LICENSE.txt ]; then
            fail "package.json declares \"license\": \"${license}\" but there is no LICENSE file to ship with it. Add one whose terms match the declared identifier."
          fi

          # THE classic footgun: tag v0.2.0 pushed while package.json still
          # says 0.1.0. npm would happily publish 0.1.0 (or 409 on a version
          # that already exists) and the tag would forever name something else.
          if [ "${REF_TYPE}" = "tag" ]; then
            case "${REF_NAME}" in
              v[0-9]*.[0-9]*.[0-9]*) : ;;
              *) fail "Tag '${REF_NAME}' is not a vMAJOR.MINOR.PATCH release tag." ;;
            esac
            if [ "${REF_NAME}" != "v${version}" ]; then
              fail "Tag '${REF_NAME}' does not match package.json version '${version}' (expected tag 'v${version}'). Fix one of the two and re-tag — do not publish a mismatch."
            fi
            echo "tag ${REF_NAME} matches package.json version ${version}"

            # A version tag alone is not adjudication: everything above proves
            # only that the tag NAMES the version, not that the commit it
            # points at ever passed a PR. Publishing is immutable and carries
            # a provenance attestation naming this repository, so require the
            # tagged commit to be reachable from main — the ref whose
            # protection rules are where adjudication actually lives. This is
            # the in-workflow backstop; the enforceable control is a tag
            # ruleset on v* restricting who may create release tags (see
            # docs/RELEASING.md). The fetch is unauthenticated on purpose
            # (persist-credentials is false) — trusted publishing already
            # requires this repository to stay public.
            git fetch --no-tags --quiet origin main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              fail "Tag '${REF_NAME}' points at a commit that is not reachable from origin/main. A release tag must name an adjudicated commit that is already on main — merge first, then tag. An off-main release is an owner decision, not a workflow default."
            fi
            echo "tagged commit is reachable from origin/main"
          elif [ "${dry_run}" != "true" ]; then
            # Guards a manual dry_run:false launched from a branch, which would
            # publish an untagged tree under whatever version happens to be in
            # package.json.
            fail "A real publish must run from a version tag; this run's ref is '${REF_NAME}' (${REF_TYPE}). Push the tag instead, or re-run with dry_run: true."
          else
            echo "no tag on this ref — dry run only, tag/version check skipped"
          fi

          # There is no token to check for — the credential is the OIDC token
          # `id-token: write` mints, and the runner advertises that it can mint
          # one by setting ACTIONS_ID_TOKEN_REQUEST_URL. Empty means the
          # permission is missing (or was narrowed at the org/repo level), and
          # `npm publish` would then fail 20 minutes from now with an
          # authentication error that reads like a registry problem. Only the
          # emptiness of the variables is tested; neither is ever echoed.
          if [ "${dry_run}" != "true" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              fail "No GitHub OIDC token is available to this job, so trusted publishing cannot authenticate. Check that this job still declares 'permissions: id-token: write' (and that the org/repo has not narrowed workflow permissions). Also confirm the trusted publisher on npmjs.com names organization/user 'swampratnz', repository 'agent-base' and workflow filename 'publish.yml' — the filename alone, with its extension, not a path. See docs/RELEASING.md."
            fi
            echo "OIDC token endpoint is available to this job"
          fi

          {
            echo "dry_run=${dry_run}"
            echo "version=${version}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      # ───────────────────────────────────────────────────────────────────────
      # The full gate. Same commands as ci.yml's three jobs, in one job here
      # because a publish is one atomic decision: every check must have passed
      # on THIS tree before the tarball leaves the runner.
      # ───────────────────────────────────────────────────────────────────────
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run context:check

      - name: Apply the schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_base_test
        run: npm run migrate

      - name: Test (with a real pgvector database)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_base_test
        run: npm test

      # DATABASE_URL is deliberately NOT set on this step, matching ci.yml's
      # security-invariants job: the gate re-runs every test file in a fresh
      # process, and pointing it at the database `npm test` has just written
      # would have it counting rows another run left behind. DB-backed
      # SECURITY: tests skip cleanly and the count floor treats a skip as a
      # pass, so the required count is identical either way — and they have
      # already run for real in the step above.
      - run: npm run test:security

      - run: npm run build

      # ───────────────────────────────────────────────────────────────────────
      # What actually ships. `files` in package.json is an allowlist, so the
      # failure mode is silent omission, not a loud error — and the two
      # omissions that matter are invisible until a consumer hits them:
      # no dist/index.js (nothing imports) and no storage/schema/*.sql
      # (nothing migrates). Assert both against the tarball itself.
      # ───────────────────────────────────────────────────────────────────────
      - name: Pack and verify the tarball contents
        id: pack
        run: |
          set -euo pipefail
          npm pack --pack-destination "${RUNNER_TEMP}" >/dev/null
          tarball=$(ls "${RUNNER_TEMP}"/swampratnz-agent-base-*.tgz | head -1)
          echo "tarball: ${tarball}"
          tar -tzf "${tarball}" | sort > "${RUNNER_TEMP}/tarball-files.txt"

          require() {
            if ! grep -qx "package/$1" "${RUNNER_TEMP}/tarball-files.txt"; then
              echo "::error::the packed tarball is missing $1 — check \"files\" in package.json"
              exit 1
            fi
          }
          require dist/index.js
          require dist/index.d.ts
          require dist/storage/schema/manifest.js
          require dist/storage/migrate.js
          require scripts/check-security-test-count.mjs
          require scripts/check-context-pack.mjs
          require README.md

          # Every fragment the manifest names must be in the tarball, not just
          # "some .sql files": a partial copy is the exact failure
          # check-dist-schema.mjs exists to catch, and it would surface
          # downstream as an ENOENT from migrate:prod on the deploy box.
          expected=$(ls src/storage/schema/*.sql | wc -l)
          actual=$(grep -c '^package/dist/storage/schema/.*\.sql$' "${RUNNER_TEMP}/tarball-files.txt")
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::tarball has ${actual} schema fragments but src/storage/schema/ has ${expected}"
            exit 1
          fi
          echo "tarball carries ${actual} SQL schema fragments, dist/ and scripts/"

          {
            echo "### Tarball contents"
            echo
            echo "\`$(basename "${tarball}")\` — $(grep -c . "${RUNNER_TEMP}/tarball-files.txt") files, ${actual} SQL schema fragments."
            echo
            echo '<details><summary>Top-level entries</summary>'
            echo
            echo '```'
            sed 's|^package/||' "${RUNNER_TEMP}/tarball-files.txt" | cut -d/ -f1 | sort -u
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish (dry run)
        if: steps.preflight.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          # A dry run does not authenticate, so it needs neither the OIDC
          # exchange nor a configured trusted publisher — which is exactly what
          # makes it usable today, before the one-time bootstrap publish. What
          # it therefore does NOT exercise is the authentication itself.
          npm publish --dry-run --access public
          echo "DRY RUN — nothing was published, and nothing authenticated." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.preflight.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # No env: block, and that is the point — there is no NODE_AUTH_TOKEN
          # and no NPM_TOKEN. npm exchanges the job's OIDC token (from the
          # job-level `id-token: write`) for a publish grant that npmjs has
          # pre-authorised for this repository and this workflow FILENAME.
          #
          # No --provenance either: trusted publishing generates and publishes
          # the provenance attestation automatically, so the flag is redundant.
          #
          # --access public stays: the @swampratnz scope defaults scoped
          # packages to restricted, and a restricted publish is precisely the
          # auth-required install this whole decision exists to avoid.
          # publishConfig says the same thing; both, because either one alone is
          # a single point of silent failure.
          npm publish --access public
          {
            echo "### Published"
            echo
            echo "\`${{ steps.preflight.outputs.name }}@${{ steps.preflight.outputs.version }}\` is on https://registry.npmjs.org, published via trusted publishing (no token involved) with an automatic provenance attestation."
            echo
            echo "Verify: \`npm view ${{ steps.preflight.outputs.name }}@${{ steps.preflight.outputs.version }}\` and \`npm audit signatures\` in a consumer."
          } >> "$GITHUB_STEP_SUMMARY"
