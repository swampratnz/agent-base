name: Canary — build community-agent against agent-base HEAD

# The cross-repo versioning mitigation from the extraction plan's risk list.
#
# Once the split lands, a base change that community-agent needs becomes
# publish → bump: two repos, two merges, and a window in which HEAD here is
# silently incompatible with the only consumer. This job closes that window by
# building the consumer against THIS commit — no publish, no version bump: the
# base is packed with `npm pack` and installed into community-agent's tree as a
# local tarball, then community-agent's own typecheck + test + build run.
#
# ─────────────────────────────────────────────────────────────────────────────
# IT WILL NOT PASS UNTIL COMMUNITY-AGENT CONSUMES THE PACKAGE, AND THAT IS
# EXPECTED.
# ─────────────────────────────────────────────────────────────────────────────
# The extraction has now landed on THIS side: `src/` is the base runtime and
# `npm pack` produces a real, installable package. community-agent still has
# its own `src/base/`, still declares no dependency on
# `@swampratnz/agent-base`, and still supplies the community values this repo
# removed. So the canary installs the tarball and then measures the gap
# (`Report what a green canary still needs`) rather than pretending to be
# green. What a green run requires on the consumer side:
#
#   1. delete `src/base/`, add `"@swampratnz/agent-base": "<version>"` as a
#      dependency, and repoint every `src/module/**` import from
#      `../../base/x.js` to `@swampratnz/agent-base`;
#   2. replace the composition root's side-effect imports with
#      `createAgent({ modules: [nzCommunityModule] })`;
#   3. supply the values base stopped shipping — the notice pack must now
#      cover `gatedNoticeWithAdmins` and `guidelinesHeading` as well as every
#      other id in `BASE_NOTICE_IDS`; `DISPLAY_TIMEZONE=Pacific/Auckland`,
#      `DISPLAY_LOCALE=en-NZ`, `DOCS_INGEST_INDEX_URL` and
#      `STATUS_CHECK_API_URL` move to env; `ModulePromptSections` takes
#      `conductGuidance` plus the `responseStyleSections`/
#      `languagePreferenceSections` maps instead of
#      `communityConduct`/`plainLanguageStyle`/`enLanguagePreference`/
#      `miLanguagePreference`; the router deps are
#      `getConductGuidelinesFn`/`getLocalisedConductGuidelinesFn`/
#      `buildDigestContentFn`; and `communityTurnState.ts` drops the five
#      `TurnStateBag` keys base now declares itself;
#   4. keep its own community schema fragments, contributed through
#      `AgentModule.migrations` rather than the base manifest.
#
# Rather than let a known-premature check red the repo, the job is gated
# behind a repository VARIABLE:
#
#     Settings → Secrets and variables → Actions → Variables
#     AGENT_BASE_CANARY_ENABLED = true
#
# Unset (the default), the job skips — the workflow stays green and schedulable.
# Turn it on in the same change that makes community-agent consume this
# package, and from then on a red canary is a real signal, not noise. A manual
# run can bypass the gate with the `force` input, which is how you try it out
# before flipping the variable.
#
# Deliberately NOT `continue-on-error`: an always-green canary is worse than no
# canary. The variable is the off switch; once it is on, failure means failure.
#
# The local-tarball mechanism below stays as it is once the package is
# published (see docs/RELEASING.md). Its whole value is that it works on a
# commit that was never published — that is what closes the HEAD-vs-registry
# window. Post-publish it becomes possible to ALSO build the consumer against
# the published version (a second job, or an input naming a version instead of
# the tarball), which would catch a packaging fault the local pack cannot see.
# That is an optional addition, never a replacement for what is here.

on:
  schedule:
    # Daily, well off the hour so it does not pile onto the top-of-hour rush.
    - cron: '37 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if AGENT_BASE_CANARY_ENABLED is not set'
        type: boolean
        default: false
      ref:
        description: 'community-agent ref to build (default: its default branch)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: canary-community-agent
  cancel-in-progress: true

jobs:
  canary:
    if: vars.AGENT_BASE_CANARY_ENABLED == 'true' || inputs.force
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: community_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Placeholder values, not credentials — they exist only to satisfy the
      # consumer's import-time config schema, exactly as its own CI does. This
      # block is the thing the extraction plan wants to delete: when the base
      # owns config and each command validates only the slice it needs, a
      # cross-repo build stops having to know the consumer's variable names.
      # Until then, keeping the list here (rather than in a secret) makes it
      # obvious that nothing real is being handled.
      CLAUDE_CODE_OAUTH_TOKEN: ci-dummy-token
      DISCORD_BOT_TOKEN: ci-dummy-token
      DISCORD_GUILD_ID: ci-dummy-guild
      WHATSAPP_PROVIDER: disabled
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/community_agent_test
    steps:
      - name: Check out agent-base (this commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .canary/base
          persist-credentials: false

      - name: Check out community-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swampratnz/community-agent
          ref: ${{ inputs.ref }}
          path: .canary/app
          persist-credentials: false
          # The default GITHUB_TOKEN is scoped to THIS repository, so it can
          # only read community-agent while that repo is public. Set the
          # CANARY_REPO_TOKEN secret (a read-only PAT or an App token) if it
          # ever goes private; the fallback keeps the public case
          # zero-configuration.
          token: ${{ secrets.CANARY_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build and pack agent-base at HEAD
        working-directory: .canary/base
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "${RUNNER_TEMP}"

      - name: Install community-agent's dependencies
        working-directory: .canary/app
        run: npm ci

      - name: Point community-agent at agent-base HEAD
        working-directory: .canary/app
        run: |
          set -euo pipefail
          # --no-save: the override is for this run only, never a commit. It
          # installs the LOCAL tarball built from this commit, so nothing is
          # published and no version is bumped — that is the whole point of a
          # canary. Once the consumer really declares the dependency this
          # replaces the registry copy in node_modules; until then it is an
          # extra top-level install that its imports do not reach yet.
          tarball=$(ls "${RUNNER_TEMP}"/swampratnz-agent-base-*.tgz | head -1)
          echo "Installing ${tarball}"
          npm install --no-save "${tarball}"

          # Fail loudly if the install did not actually take. An
          # always-succeeding "point at HEAD" step would make every later step
          # a test of the registry copy (or of nothing at all), which is
          # exactly the silent-green failure mode this job exists to avoid.
          installed=.canary-check
          node -e '
            const fs = require("fs");
            const p = "node_modules/@swampratnz/agent-base/package.json";
            if (!fs.existsSync(p)) {
              console.error("canary: the agent-base tarball is not installed in community-agent/node_modules");
              process.exit(1);
            }
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            if (!fs.existsSync("node_modules/@swampratnz/agent-base/dist/index.js")) {
              console.error("canary: installed package has no dist/index.js — npm pack shipped an unbuilt tree");
              process.exit(1);
            }
            console.log(`canary: installed @swampratnz/agent-base@${pkg.version} from the local tarball`);
          '
          rm -f "$installed"

      - name: Report what a green canary still needs
        working-directory: .canary/app
        run: |
          set -euo pipefail
          {
            echo "### Canary gap report"
            echo
            if node -e 'const p=require("./package.json");process.exit((p.dependencies||{})["@swampratnz/agent-base"]?0:1)'; then
              echo "- community-agent DECLARES a dependency on \`@swampratnz/agent-base\` ✅"
            else
              echo "- community-agent does NOT declare \`@swampratnz/agent-base\` yet — the steps below"
              echo "  exercise its own tree, not this package. See the header of this workflow for"
              echo "  the follow-up PR's checklist."
            fi
            if [ -d src/base ]; then
              echo "- \`src/base/\` still exists there ($(find src/base -type f | wc -l) files) — it is the copy this package replaces."
            else
              echo "- \`src/base/\` is gone ✅"
            fi
            echo
            echo "Installed base version: $(node -p 'require("./node_modules/@swampratnz/agent-base/package.json").version')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: community-agent typecheck
        working-directory: .canary/app
        run: npm run typecheck

      - name: community-agent migrate
        working-directory: .canary/app
        run: npm run migrate

      - name: community-agent test
        working-directory: .canary/app
        run: npm test

      - name: community-agent build
        working-directory: .canary/app
        run: npm run build
