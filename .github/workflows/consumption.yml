name: Consumption

# Does a CONSUMER work? Everything else in CI asks whether this repository is
# internally consistent; this asks the only question that ships.
#
# The distinction is not academic. Every defect that has reached a published
# artifact so far was invisible to a green `ci.yml` run, because each needed a
# condition CI does not produce — see docs/PIPELINE.md. Two of them were
# exactly this shape:
#
#   * 0.1.0 published only the `.` barrel, so nothing past it was importable.
#     The first consumer had to patch the installed package.json to work at all.
#   * 0.1.1's exports map declared {types, import} only, so any `require`
#     resolution failed with ERR_PACKAGE_PATH_NOT_EXPORTED (issue #11).
#
# Neither is visible from inside this repository, at all, ever: our own tests
# import `../src/…` by relative path and never traverse the exports map.
#
# THE TARBALL IS THE POINT. Install a packed artifact, never a workspace link
# or a `file:` reference to the source tree. A link resolves through src/ and
# silently answers "yes" to every question this job exists to ask — whether
# `exports` admits the specifier, whether `files` shipped the file, whether the
# .sql fragments travelled. A link would make this job pass forever and mean
# nothing.
#
# It also gates `template/`, which nothing else does (issue #21). template/ is
# deliberately outside lint, Prettier and both tsconfigs — it is copied OUT of
# this repo, so formatting it here would impose this repo's choices on someone
# else's future repo — and it is not in `files`, so the publish preflight never
# sees it either. That left its dependency range pinned at ^0.1.1 across the
# 0.2.0 release, silently scaffolding new repos onto the version with the
# broken exports map. Six gates missed it. This one would not have.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: consumption-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, same reasoning as ci.yml: this runs on `pull_request`, so it
# executes PR-controlled code (npm lifecycle scripts, the scaffold's build).
permissions:
  contents: read

jobs:
  consume:
    name: node ${{ matrix.node }}, npm ${{ matrix.npm-label }}
    runs-on: ubuntu-latest
    strategy:
      # Never cancel siblings: which CELLS fail is the whole signal. A
      # toolchain-specific break that took the matrix down with it would look
      # identical to a break that affects every toolchain.
      fail-fast: false
      matrix:
        include:
          # The everyday case: current Node, whatever npm ships with it.
          - node: 24
            npm: ''
            npm-label: bundled
          # The other end of `engines: >=22`, with npm pinned to the release
          # toolchain. npm 10 (which Node 22 bundles) does NOT enforce the
          # package.json/package-lock.json version pairing and npm 11 does —
          # that asymmetry is exactly how a lockfile stuck at 0.0.1 while
          # package.json said 0.1.1 passed CI and would have failed to publish.
          - node: 22
            npm: '^11.5.1'
            npm-label: '11.x'
    services:
      # The scaffold runs `migrate` and its DB-backed tests for real. Same
      # image and health-check shape as ci.yml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consumer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/consumer_test
      # The scaffold's config parse wants these present; values are irrelevant
      # because no adapter is constructed. Kept here rather than in a .env so
      # it is obvious they are fixtures.
      CLAUDE_CODE_OAUTH_TOKEN: smoke-not-a-real-token
      DISCORD_BOT_TOKEN: smoke-not-a-real-token
      DISCORD_GUILD_ID: '1'
      WHATSAPP_PROVIDER: disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        if: matrix.npm != ''
        run: |
          npm install -g "npm@${{ matrix.npm }}"
          npm --version

      - run: npm ci

      # `npm pack` does NOT run prepublishOnly (that fires on publish only) and
      # there is no prepack hook, so dist/ must be built explicitly or the
      # tarball ships stale or empty.
      - name: Build and pack the real artifact
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          ls -l "$RUNNER_TEMP/pkg"

      - name: Scaffold template/ into a fresh directory
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          cp -R template/. "$RUNNER_TEMP/app/"

      - name: Install the packed tarball (never a link)
        working-directory: ${{ runner.temp }}/app
        run: |
          tarball="$(ls "$RUNNER_TEMP"/pkg/*.tgz)"
          npm install "$tarball" --no-audit --no-fund
          installed="$(node -p "require('@swampratnz/agent-base/package.json').version")"
          echo "installed @swampratnz/agent-base@$installed"
          # The scaffold's own declared range must ADMIT the version this repo
          # builds. A caret on a 0.x major pins the minor, so template/'s range
          # needs bumping on every framework minor — that is issue #21, and
          # this is what stops it recurring silently.
          repo_version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          if [ "$installed" != "$repo_version" ]; then
            echo "::error::template/ resolved $installed but this repo builds $repo_version — bump template/package.json's range"
            exit 1
          fi

      # The scaffolded repo's OWN gate, exactly as its package.json defines it.
      # Not a re-run of ours: the gate scripts here execute out of
      # node_modules/@swampratnz/agent-base/scripts/ with `--root .`, which is
      # the arrangement a real scaffolded repo uses and nothing else tests.
      - name: The scaffold's own gate
        working-directory: ${{ runner.temp }}/app
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
          npm run test:security
          npm run context:check

      - name: Migrate, and prove the SQL fragments travelled in the tarball
        working-directory: ${{ runner.temp }}/app
        run: |
          npm run migrate
          # check-dist-schema.mjs proves dist/ matches the manifest in OUR
          # tree. Nothing proves the fragments reached a consumer — and a
          # consumer that installs this and cannot migrate is broken in a way
          # no unit test sees.
          shipped="$(ls node_modules/@swampratnz/agent-base/dist/storage/schema/*.sql | wc -l)"
          expected="$(ls "$GITHUB_WORKSPACE"/src/storage/schema/*.sql | wc -l)"
          echo "fragments: $shipped shipped, $expected in source"
          if [ "$shipped" != "$expected" ]; then
            echo "::error::$expected .sql fragments in src/ but $shipped in the installed package"
            exit 1
          fi

      # ---- Boot smoke (issue #23) -----------------------------------------
      #
      # Two halves, and the negative one is not a lesser test. Asserting the
      # EXACT expected failure means any OTHER failure — an import-time throw
      # like the one that killed community-agent's built entry point, a
      # resolution error, a config parse — fails this step, because it would
      # not produce this message.

      - name: Boot smoke — the scaffold refuses an incomplete composition, naming every gap
        working-directory: ${{ runner.temp }}/app
        run: |
          set +e
          out="$(node dist/main.js 2>&1)"
          status=$?
          set -e
          echo "$out"

          if [ "$status" -eq 0 ]; then
            echo "::error::the scaffold booted, but template/ registers only promptSections — it must refuse"
            exit 1
          fi

          # The plan pass reports every problem TOGETHER, before any side
          # effect. That property is the whole reason it is a separate pass, so
          # assert the count, not just that something was mentioned.
          case "$out" in
            *"8 problem(s) with this composition"*) ;;
            *) echo "::error::expected all 8 missing registrations reported at once"; exit 1 ;;
          esac

          for gap in "notice pack" "tool tiers" "tool-server parts" \
                     "flagged-tool predicates" "skills manifest" "commands" \
                     "default bad words" "default persona"; do
            case "$out" in
              *"$gap"*) ;;
              *) echo "::error::the refusal did not name: $gap"; exit 1 ;;
            esac
          done

      - name: Boot smoke — a COMPLETE composition starts, from the installed package
        working-directory: ${{ runner.temp }}/app
        run: |
          cp "$GITHUB_WORKSPACE/.github/smoke/boot.mjs" ./boot.mjs
          out="$(node boot.mjs 2>&1)"
          echo "$out"
          case "$out" in
            *"SMOKE OK"*) ;;
            *) echo "::error::a complete composition failed to reach started"; exit 1 ;;
          esac

  # ---- Cross-platform pack (issue #25) ----------------------------------
  #
  # Build and pack only — NOT the full sequence. Service containers are a
  # Linux-runner feature, so there is no Postgres here and the scaffold's
  # migrate/DB tests cannot run; pretending otherwise would mean a matrix that
  # silently skips its own point.
  #
  # What this catches is shell-isms in the build path. `cp src/.../*.sql` used
  # to be the copy step, and `cp` is not a command on Windows — it failed on a
  # laptop DURING a release, after the tarball had been prepared, which is the
  # worst possible moment. `scripts/copy-schema.mjs` replaced it, and this is
  # what stops the next one arriving the same way: the build script,
  # copy-schema.mjs and check-dist-schema.mjs all run on whoever's machine cuts
  # a release or scaffolds a repo.
  pack-portability:
    name: build + pack on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # `shell: bash` on every script step so ONE script serves all three
      # runners — Windows runners ship Git Bash. Without it these would be
      # PowerShell on Windows and the comparison would be meaningless.
      - name: Pack, and prove the fragments are IN the tarball
        shell: bash
        run: |
          # A RELATIVE pack destination, deliberately. $RUNNER_TEMP on Windows
          # is `D:\a\_temp`, and GNU tar reads a leading `D:` as an rsh-style
          # host spec — the first run of this job died with
          # `tar (child): Cannot connect to D: resolve failed`. The usual fix,
          # --force-local, is GNU-only and would break macOS's bsdtar, so the
          # portable answer is to hand tar a path with no drive letter in it.
          mkdir -p .pack
          npm pack --pack-destination .pack
          tarball="$(ls .pack/*.tgz)"

          # Read the count out of the TARBALL, not out of dist/. dist/ is what
          # the build produced on this machine; the tarball is what a consumer
          # would receive, and the copy step is exactly what broke on Windows.
          shipped="$(tar -tzf "$tarball" | grep -c '\.sql$' || true)"
          expected="$(ls src/storage/schema/*.sql | wc -l | tr -d ' ')"
          echo "fragments: $shipped in the tarball, $expected in src/"
          if [ "$shipped" != "$expected" ]; then
            echo "::error::$expected .sql fragments in src/ but $shipped reached the tarball on ${{ matrix.os }}"
            exit 1
          fi

  # ---- The npm 12 limitation (issue #24) --------------------------------
  #
  # This job asserts a KNOWN, CURRENTLY-TRUE LIMITATION rather than a property
  # we want. It is green while the limitation holds and red when it changes,
  # in EITHER direction, because either way the README is then wrong.
  #
  # The finding: npm 12 refuses all git-protocol fetches (EALLOWGIT), and
  # `@whiskeysockets/baileys` — a direct dependency — declares
  # `libsignal: git+https://github.com/whiskeysockets/libsignal-node.git`.
  # So a consumer on npm 12 cannot install this package AT ALL. Not a
  # dev-environment quirk: it is the published tarball's own dependency tree,
  # and npm 12 is current `latest`.
  #
  # That is a product decision (drop Baileys? make it optional? vendor
  # libsignal?), tracked separately. What belongs HERE is that nobody
  # rediscovers it by accident, and that the day it changes we notice and
  # update the docs rather than leaving a stale warning in the README.
  npm12-limitation:
    name: npm 12 still refuses the git dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: A consumer on npm 12 cannot install this package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/n12app"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          tarball="$(ls "$RUNNER_TEMP"/pkg/*.tgz)"
          cp -R template/. "$RUNNER_TEMP/n12app/"

          npm install -g npm@12
          npm --version

          cd "$RUNNER_TEMP/n12app"
          set +e
          out="$(npm install "$tarball" --no-audit --no-fund 2>&1)"
          status=$?
          set -e
          echo "$out"

          if [ "$status" -ne 0 ] && printf '%s' "$out" | grep -q 'EALLOWGIT'; then
            echo "Limitation holds: npm 12 refuses the git-protocol dependency, as README documents."
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            echo "::error::npm 12 CAN now install this package. Good news — remove the limitation from README's consumer section and delete this job."
            exit 1
          fi

          echo "::error::npm 12 failed for a DIFFERENT reason than EALLOWGIT. Read the log above; the documented limitation may be wrong."
          exit 1
